name: App dev builds
# Every merge into main that changes the app gets a dev build: a signed bundle with the version
# <next patch>-dev.<run>, released as the pre-release app/<id>@<that version>. Only a preview server whose
# admin set the app to take dev builds installs it. Each app keeps its newest few dev builds.
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'service/**', 'manifest.json', 'Dockerfile']
concurrency:
  group: app-dev
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  id-token: write # signed keyless as this workflow on main: the app runner takes dev builds only from it
jobs:
  dev:
    # A Version packages merge is released by release.yml, not built twice.
    if: "!startsWith(github.event.head_commit.message, 'Version packages')"
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@v3
      - uses: oras-project/setup-oras@v1
      - name: Build, sign and release a dev build
        run: |
          version=$(pnpm exec augur-app dev "$GITHUB_RUN_NUMBER")
          pnpm build && pnpm release-out
          pnpm exec augur-app bundle dev > "$RUNNER_TEMP/bundle.json"
          pnpm exec augur-app publish "$RUNNER_TEMP/bundle.json"
          pnpm exec augur-app clean-devs "app/$(jq -r .id manifest.json)@$version"
          echo "Dev build $version: a preview server set to take its dev builds installs it at its next check." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
      - name: Tell AUGUR's release feed
        run: gh workflow run feed.yml -R "${{ vars.AUGUR_REPO || 'harry-burton-dev/im-platform' }}"
        env:
          GH_TOKEN: ${{ secrets.APP_RELEASES_TOKEN }}
